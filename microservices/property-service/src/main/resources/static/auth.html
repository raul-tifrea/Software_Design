<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome - Real Estate Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }

        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 24px;
            color: #000;
        }

        .brand p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .card {
            background: #fff;
            border: 1px solid #ccc;
            padding: 30px;
            width: 100%;
            max-width: 350px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .field input {
            width: 100%;
            padding: 8px;
            border: 1px solid #aaa;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: #0066cc;
            color: #fff;
            border: 1px solid #005bb5;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-primary:hover {
            background: #005bb5;
        }

        .btn-success {
            background: #28a745;
            border-color: #218838;
        }

        .btn-success:hover {
            background: #218838;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            font-size: 12px;
            color: #888;
        }

        .link-row {
            text-align: center;
            margin-top: 10px;
        }

        .link-btn,
        .guest-btn {
            background: none;
            border: none;
            color: #0066cc;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }

        .guest-btn {
            color: #666;
        }

        .message {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
            min-height: 15px;
        }

        .error {
            color: #cc0000;
        }

        .success {
            color: #008800;
        }
    </style>
</head>

<body>

    <div class="brand">
        <h1>Real Estate Hub</h1>
    </div>

    <div class="card" id="loginView">
        <h2>Sign In</h2>

        <div class="field">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="Enter your username">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
        </div>

        <button class="btn-primary" onclick="attemptLogin()">Sign In</button>
        <div id="loginMsg" class="message error"></div>

        <div class="divider"><span>or</span></div>

        <div class="link-row">
            <button class="link-btn" onclick="toggleView('registerView')">Create an account</button>
        </div>
        <div class="link-row" style="margin-top: 10px;">
            <button class="guest-btn" onclick="continueAsGuest()">Continue as Guest →</button>
        </div>
    </div>

    <div class="card hidden" id="registerView">
        <h2>Create Account</h2>

        <div class="field">
            <label>Username</label>
            <input type="text" id="regUsername" placeholder="Choose a username">
        </div>
        <div class="field">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="your@email.com">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a password">
        </div>

        <button class="btn-primary btn-success" onclick="attemptRegister()">Register</button>
        <div id="regMsg" class="message"></div>

        <div class="link-row" style="margin-top: 16px;">
            <button class="link-btn" onclick="toggleView('loginView')">← Back to Sign In</button>
        </div>
    </div>

    <script>
        const USER_API = 'http://localhost:8082/api/users';

        function toggleView(viewId) {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('registerView').classList.add('hidden');
            document.getElementById('loginMsg').innerText = '';
            document.getElementById('regMsg').innerText = '';
            document.getElementById(viewId).classList.remove('hidden');
        }

        function attemptLogin() {
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const msgEl = document.getElementById('loginMsg');
            msgEl.innerText = '';

            if (!user || !pass) { msgEl.innerText = 'Please fill in all fields.'; return; }

            const encodedToken = btoa(user + ":" + pass);

            fetch(`${USER_API}/login?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`, { method: 'POST' })
                .then(async response => {
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || "Invalid credentials");
                    }
                    return response.json();
                })
                .then(data => {
                    localStorage.setItem('userId', data.id);
                    localStorage.setItem('roleName', data.role.roleName);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('authToken', encodedToken);
                    window.location.href = 'dashboard.html';
                })
                .catch(error => { msgEl.innerText = error.message; });
        }

        function attemptRegister() {
            const newUser = {
                username: document.getElementById('regUsername').value.trim(),
                email: document.getElementById('regEmail').value.trim(),
                passwordHash: document.getElementById('regPassword').value,
                role: { roleName: "SELLER_BUYER" }
            };
            const msgEl = document.getElementById('regMsg');
            msgEl.className = 'message';
            msgEl.innerText = '';

            fetch(`${USER_API}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newUser)
            })
                .then(async response => {
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || "Registration failed");
                    }
                    return response.json();
                })
                .then(() => {
                    msgEl.classList.add('success');
                    msgEl.innerText = "Account created! Redirecting to login…";
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regEmail').value = '';
                    document.getElementById('regPassword').value = '';
                    setTimeout(() => toggleView('loginView'), 2000);
                })
                .catch(error => {
                    msgEl.classList.add('error');
                    msgEl.innerText = error.message;
                });
        }

        function continueAsGuest() {
            localStorage.setItem('userId', '');
            localStorage.setItem('roleName', 'GUEST');
            localStorage.setItem('username', 'Guest Visitor');
            localStorage.setItem('authToken', '');
            window.location.href = 'dashboard.html';
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (!document.getElementById('loginView').classList.contains('hidden')) attemptLogin();
                else attemptRegister();
            }
        });
    </script>
</body>

</html>
