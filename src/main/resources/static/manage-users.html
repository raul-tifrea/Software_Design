<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Users - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .panel { padding: 20px; border-radius: 8px; margin-bottom: 20px; background: white; border: 1px solid #ddd; }
        input, select, button { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white;}
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-danger { background-color: #dc3545; }
    </style>
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Admin Panel: Manage Users</h2>
    <button style="background-color: #6c757d;" onclick="window.location.href='dashboard.html'">&larr; Back to Dashboard</button>
</div>

<div class="panel">
    <h3>Create New User</h3>
    <input type="text" id="newUsername" placeholder="Username" required>
    <input type="email" id="newEmail" placeholder="Email Address" required>
    <input type="password" id="newPassword" placeholder="Password" required>
    <select id="newRole">
        <option value="3">SELLER_BUYER</option>
        <option value="1">ADMIN</option>
    </select>
    <button style="background-color: #28a745;" onclick="createUser()">Create User</button>
</div>

<div class="panel">
    <h3>Current Users</h3>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="usersList">
        </tbody>
    </table>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api/users';
    const currentUserId = localStorage.getItem('userId');
    const authToken = localStorage.getItem('authToken');

    if (!authToken || authToken === '') {
        window.location.href = 'auth.html';
    }

    const securityHeaders = {
        'Content-Type': 'application/json',
        'Authorization': 'Basic ' + authToken
    };

    function loadUsers() {
        fetch(`${API_BASE}?reqId=${currentUserId}`, {
            method: 'GET',
            headers: { 'Authorization': 'Basic ' + authToken }
        })
        .then(res => {
            if (!res.ok) throw new Error("Unauthorized");
            return res.json();
        })
        .then(users => {
            const list = document.getElementById('usersList');
            list.innerHTML = '';
            users.forEach(user => {
                list.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${user.role.roleName}</td>
                        <td>
                            <button class="btn-danger" onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        })
        .catch(err => {
            console.error(err);
            alert("Security Error: Please log out and log back in.");
        });
    }

    function createUser() {
        const newUser = {
            username: document.getElementById('newUsername').value,
            email: document.getElementById('newEmail').value,
            passwordHash: document.getElementById('newPassword').value,
            role: { id: parseInt(document.getElementById('newRole').value) }
        };

        fetch(`${API_BASE}?reqId=${currentUserId}`, {
            method: 'POST',
            headers: securityHeaders,
            body: JSON.stringify(newUser)
        })
        .then(res => {
            if (!res.ok) throw new Error("Could not create user");
            document.getElementById('newUsername').value = '';
            document.getElementById('newEmail').value = '';
            document.getElementById('newPassword').value = '';
            loadUsers();
        })
        .catch(err => alert(err.message));
    }

    function deleteUser(id) {
        if (!confirm("Are you sure you want to permanently delete this user?")) return;

        fetch(`${API_BASE}/${id}?reqId=${currentUserId}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Basic ' + authToken }
        })
        .then(res => {
            if (!res.ok) throw new Error("Could not delete user");
            loadUsers();
        })
        .catch(err => alert(err.message));
    }

    loadUsers();
</script>
</body>
</html>
